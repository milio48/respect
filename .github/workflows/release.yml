name: Release Respect Desktop

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Nomor versi release (misal: 1.0.0)'
        required: false
        default: '1.0.0'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Determine Version
        id: get_version
        shell: pwsh
        run: |
          $ver = "${{ github.event.inputs.version }}"
          if ([string]::IsNullOrWhiteSpace($ver)) {
            if ($env:GITHUB_REF -match 'refs/tags/v?(.*)') {
              $ver = $Matches[1]
            } else {
              $ver = "1.0.0"
            }
          }
          Write-Host "Version: $ver"
          "version=$ver" >> $env:GITHUB_OUTPUT

      - name: Build Respect Lite (v49) & Respect Modern (v132)
        shell: pwsh
        run: |
          $ver = "${{ steps.get_version.outputs.version }}"
          $fileVer = "$ver.0"
          if ($fileVer.Split('.').Count -lt 4) { $fileVer = "$ver.0.0" }

          # 1. Bangun Respect Lite (v49 standalone 64-bit)
          $liteDir = "dist/respect-lite"
          New-Item -ItemType Directory -Path $liteDir -Force | Out-Null
          go build -ldflags="-s -w -H windowsgui -X respect-app/internal/version.AppVersion=$ver" -o "$liteDir/respect-lite.exe" .
          if ((Test-Path "assets/rcedit.exe") -and (Test-Path "assets/respect-lite.ico")) {
            .\assets\rcedit.exe "$liteDir/respect-lite.exe" `
              --set-icon "assets/respect-lite.ico" `
              --set-product-version "$ver" `
              --set-file-version "$fileVer" `
              --set-version-string "ProductName" "Respect Desktop Lite" `
              --set-version-string "FileDescription" "Respect Desktop Builder & Runner (Lite Engine 64-bit)" `
              --set-version-string "CompanyName" "milio48" `
              --set-version-string "LegalCopyright" "Copyright (c) 2026 milio48" `
              --set-version-string "OriginalFilename" "respect-lite.exe"
          }

          # 1b. Bangun Respect Lite x86 (v49 standalone 32-bit untuk Windows lawas)
          $env:GOARCH = "386"
          go build -ldflags="-s -w -H windowsgui -X respect-app/internal/version.AppVersion=$ver" -o "$liteDir/respect-lite-x86.exe" .
          if ((Test-Path "assets/rcedit.exe") -and (Test-Path "assets/respect-lite.ico")) {
            .\assets\rcedit.exe "$liteDir/respect-lite-x86.exe" `
              --set-icon "assets/respect-lite.ico" `
              --set-product-version "$ver" `
              --set-file-version "$fileVer" `
              --set-version-string "ProductName" "Respect Desktop Lite (32-bit)" `
              --set-version-string "FileDescription" "Respect Desktop Builder & Runner (Lite Engine 32-bit)" `
              --set-version-string "CompanyName" "milio48" `
              --set-version-string "LegalCopyright" "Copyright (c) 2026 milio48" `
              --set-version-string "OriginalFilename" "respect-lite-x86.exe"
          }
          $env:GOARCH = "amd64"

          # 2. Bangun Respect Modern (v132 Standalone Single File - Engine Tertanam)
          $modernDir = "dist/respect"
          New-Item -ItemType Directory -Path $modernDir -Force | Out-Null
          go build -tags "v132,embed132" -ldflags="-s -w -H windowsgui -X respect-app/internal/version.AppVersion=$ver" -o "$modernDir/respect.exe" .
          if ((Test-Path "assets/rcedit.exe") -and (Test-Path "assets/respect-full.ico")) {
            .\assets\rcedit.exe "$modernDir/respect.exe" `
              --set-icon "assets/respect-full.ico" `
              --set-product-version "$ver" `
              --set-file-version "$fileVer" `
              --set-version-string "ProductName" "Respect Desktop" `
              --set-version-string "FileDescription" "Respect Desktop Builder & Runner (Modern Engine Standalone)" `
              --set-version-string "CompanyName" "milio48" `
              --set-version-string "LegalCopyright" "Copyright (c) 2026 milio48" `
              --set-version-string "OriginalFilename" "respect.exe"
          }

      - name: Create GitHub Release & Upload Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          name: "Respect Desktop v${{ steps.get_version.outputs.version }}"
          tag_name: ${{ github.ref_name || format('v{0}', steps.get_version.outputs.version) }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/respect/respect.exe
            dist/respect-lite/respect-lite.exe
            dist/respect-lite/respect-lite-x86.exe
