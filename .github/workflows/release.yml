name: Release Respect Desktop

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Nomor versi release (misal: 1.0.0)'
        required: false
        default: '1.0.0'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Determine Version
        id: get_version
        shell: pwsh
        run: |
          $ver = "${{ github.event.inputs.version }}"
          if ([string]::IsNullOrWhiteSpace($ver)) {
            if ($env:GITHUB_REF -match 'refs/tags/v?(.*)') {
              $ver = $Matches[1]
            } else {
              $ver = "1.0.0"
            }
          }
          Write-Host "Version: $ver"
          "version=$ver" >> $env:GITHUB_OUTPUT

      - name: Build Respect Desktop Binaries
        shell: pwsh
        run: |
          $ver = "${{ steps.get_version.outputs.version }}"
          .\scripts\build.ps1 -Target all -Embed -Version "$ver"

      - name: Create GitHub Release & Upload Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          name: "Respect Desktop v${{ steps.get_version.outputs.version }}"
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', steps.get_version.outputs.version) }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/respect/respect.exe
            dist/respect-lite/respect-lite.exe
            dist/respect-lite/respect-lite-x86.exe
